<h1 class="">Действующие ретро-бонусы поставщиков</h1>
<p style="margin-left: 0px">Отчёт используется для анализа действующих условий ретро-бонуса поставщика за выбранный период по поставщику, контрагенту, договору или соглашению с поставщиком. </p>
